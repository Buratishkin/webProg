<VirtualHost *:80>
    ServerName localhost
    DocumentRoot C:\Users\novik\OneDrive\Desktop\web\lab1\front

    # Включаем необходимые модули
    LoadModule proxy_module modules/mod_proxy.so
    LoadModule proxy_http_module modules/mod_proxy_http.so

    # Перенаправляем API запросы на Java сервер
    ProxyPass /app http://localhost:8080
    ProxyPassReverse /app http://localhost:8080

    # Настройки для статических файлов
    <Directory "C:\Users\novik\OneDrive\Desktop\web\lab1\front">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Логирование
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>